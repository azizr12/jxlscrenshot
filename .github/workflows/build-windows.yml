name: build-windows installer
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libjxl
            zip

      - name: Compile and bundle runtime DLLs
        run: |
          # 1. Compile CLI version
          gcc -O2 -s -flto -ffunction-sections -fdata-sections -Wl,--gc-sections \
              -mwindows -o jxlshot.exe jxlshot.c \
              -ljxl_threads -ljxl -lgdi32 -luser32 -lshell32 -lole32 -ldxgi -ld3d11 -luuid

          # 2. EXPLICITLY compile the resource file using windres
          windres -i resource.rc -o resource.o

          # 3. Compile Tray version using the compiled resource object
          gcc -O2 -s -flto -ffunction-sections -fdata-sections -Wl,--gc-sections \
              -mwindows -o jxlshot_tray.exe jxlshot_tray.c resource.o \
              -ljxl_threads -ljxl -lgdi32 -luser32 -lshell32 -lcomctl32 -lmsimg32 -lole32 -ldxgi -ld3d11 -luuid -lurlmon

          # 4. Prepare distribution directory
          mkdir -p dist
          cp jxlshot.exe jxlshot_tray.exe dist/
          
          # Copy auxiliary files
          cp README.md dist/ 2>/dev/null || true

          # 5. Extract and copy required MinGW/libjxl DLLs (Recursive Resolution)
          # Safely catches all transitive dependencies without executing the .exe
          mkdir -p temp_dlls
          objdump -p jxlshot.exe jxlshot_tray.exe | grep "DLL Name" | sed 's/.*DLL Name: //' | sort -u > dll_list.txt
          
          while true; do
              count_before=$(wc -l < dll_list.txt)
              while read -r dll; do
                  found=$(find /mingw64/bin -maxdepth 1 -iname "$dll" | head -n 1)
                  if [ -n "$found" ] && [ ! -f "temp_dlls/$dll" ]; then
                      cp "$found" temp_dlls/
                      objdump -p "$found" | grep "DLL Name" | sed 's/.*DLL Name: //' >> dll_list.txt
                  fi
              done < dll_list.txt
              sort -u dll_list.txt -o dll_list.txt
              count_after=$(wc -l < dll_list.txt)
              [ "$count_before" -eq "$count_after" ] && break
          done
          
          cp temp_dlls/*.dll dist/
          rm -rf temp_dlls dll_list.txt

      # Removed the UPX compression step. 
      # UPX frequently corrupts the Windows RT_MANIFEST resource in MinGW builds, 
      # which causes the "Side-by-Side configuration is incorrect" crash on startup.

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          # Locate Inno Setup Compiler (ISCC) typically pre-installed on windows-latest
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-Not (Test-Path $iscc)) {
              Write-Host "Inno Setup not found. Installing via Chocolatey..."
              choco install innosetup -y
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          
          # Compile the installer script
          & $iscc setup.iss
          
          # Move the setup executable to the dist folder for the release
          mv Output/jxlshot-setup-x64.exe dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-setup-x64
          path: dist/jxlshot-setup-x64.exe

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jxlshot-setup-x64.exe