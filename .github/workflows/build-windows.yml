name: build-windows installer
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libjxl
            zip

      - name: Compile and bundle runtime DLLs
        run: |
          # EXPLICITLY compile the resource file using windres
          windres -i resource.rc -o resource.o

          # Compile Tray version using the compiled resource object
          gcc -O2 -s -flto -ffunction-sections -fdata-sections -Wl,--gc-sections \
              -mwindows -o jxlshot_tray.exe jxlshot_tray.c resource.o \
              -ljxl_threads -ljxl -lgdi32 -luser32 -lshell32 -lcomctl32 -lmsimg32 -lole32 -ldxgi -ld3d11 -luuid -lurlmon

          # Prepare distribution directory
          mkdir -p dist
          cp jxlshot_tray.exe dist/
          
          # Copy auxiliary files
          cp README.md dist/ 2>/dev/null || true

          # Extract and copy required MinGW/libjxl DLLs
          # Safely catches all transitive dependencies without executing the .exe (using ldd)
          ldd jxlshot_tray.exe | grep "/mingw64/bin" | awk '{print $3}' | sort -u | xargs -I {} cp {} dist/

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          # Locate Inno Setup Compiler (ISCC) typically pre-installed on windows-latest
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-Not (Test-Path $iscc)) {
              Write-Host "Inno Setup not found. Installing via Chocolatey..."
              choco install innosetup -y
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          
          # Compile the installer script
          & $iscc setup.iss
          
          # Move the setup executable to the dist folder for the release
          Move-Item -Path "Output\jxlshot-setup-x64.exe" -Destination "dist\" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-setup-x64
          path: dist/jxlshot-setup-x64.exe

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jxlshot-setup-x64.exe