name: build-portable
on:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libjxl
            zip

      - name: Compile and bundle runtime DLLs
        run: |
          # EXPLICITLY compile the resource file using windres
          windres -i resource.rc -o resource.o

          # Compile Tray version using the compiled resource object
          gcc -O2 -s -flto -ffunction-sections -fdata-sections -Wl,--gc-sections \
              -mwindows -o jxlshot_tray.exe jxlshot_tray.c resource.o \
              -ljxl_threads -ljxl -lgdi32 -luser32 -lshell32 -lcomctl32 -lmsimg32 -lole32 -ldxgi -ld3d11 -luuid -lurlmon

          # Prepare distribution directory
          mkdir -p dist
          cp jxlshot_tray.exe dist/
          
          # Copy auxiliary files
          cp README.md dist/ 2>/dev/null || true

          # Extract and copy required MinGW/libjxl DLLs
          # Safely catches all transitive dependencies without executing the .exe (using ldd)
          ldd jxlshot_tray.exe | grep "/mingw64/bin" | awk '{print $3}' | sort -u | xargs -I {} cp {} dist/

      # Removed the UPX compression step. 

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-windows-x64
          path: dist/

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jxlshot-windows-x64.zip