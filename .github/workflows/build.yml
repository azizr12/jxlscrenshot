# One workflow: builds portable ZIP + installer EXE for x64 and ARM64,
# uploads them, and attaches them to a GitHub release when a v* tag is pushed.

name: build-windows installer
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: build-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-latest
            msystem: MINGW64
            pkgprefix: mingw-w64-x86_64
            cc: gcc
            objdump: objdump
          - arch: arm64
            runner: windows-11-arm
            msystem: CLANGARM64
            pkgprefix: mingw-w64-clang-aarch64
            cc: clang
            objdump: llvm-objdump
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (${{ matrix.msystem }})
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          update: true
          install: >-
            ${{ matrix.pkgprefix }}-toolchain
            ${{ matrix.pkgprefix }}-libjxl
            zip

      - name: Compile and bundle runtime DLLs
        run: |
          windres -i resource.rc -o resource.o

          ${{ matrix.cc }} -O2 -s -flto -ffunction-sections -fdata-sections -Wl,--gc-sections \
              -mwindows -o jxlshot_tray.exe jxlshot_tray.c resource.o \
              -ljxl_threads -ljxl -lgdi32 -luser32 -lshell32 -lcomctl32 -lmsimg32 -lole32 -ldxgi -ld3d11 -luuid -lgdiplus

          mkdir -p dist
          cp jxlshot_tray.exe dist/
          cp README.md dist/ 2>/dev/null || true

          # Recursively collect non-system DLL dependencies from the toolchain's bin dir
          # (uses objdump instead of ldd, which can't read ARM64 binaries reliably)
          BINDIR="$MSYSTEM_PREFIX/bin"
          collect() {
            for dll in $(${{ matrix.objdump }} -p "$1" | awk '/DLL Name:/ {print $3}'); do
              if [ -f "$BINDIR/$dll" ] && [ ! -f "dist/$dll" ]; then
                cp "$BINDIR/$dll" dist/
                collect "$BINDIR/$dll"
              fi
            done
          }
          collect jxlshot_tray.exe

          echo "--- dist contents ---"
          ls -lh dist/

      - name: Package portable ZIP
        run: |
          (cd dist && zip -r ../jxlshot-windows-${{ matrix.arch }}.zip .)
          ls -lh jxlshot-windows-${{ matrix.arch }}.zip

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-Not (Test-Path $iscc)) {
              Write-Host "Inno Setup not found. Installing via Chocolatey..."
              choco install innosetup -y --no-progress
          }
          if (-Not (Test-Path $iscc)) {
              throw "Inno Setup compiler not found."
          }

          & $iscc "/DMyArch=${{ matrix.arch }}" setup.iss
          if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed with exit code $LASTEXITCODE"
          }

          if (-Not (Test-Path "Output\jxlshot-setup-${{ matrix.arch }}.exe")) {
              Get-ChildItem -Recurse -Filter *.exe | Select-Object FullName
              throw "The installer EXE was not created."
          }

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v7
        with:
          name: jxlshot-windows-${{ matrix.arch }}.zip
          path: jxlshot-windows-${{ matrix.arch }}.zip
          archive: false
          if-no-files-found: error

      - name: Upload installer EXE
        uses: actions/upload-artifact@v7
        with:
          name: jxlshot-setup-${{ matrix.arch }}.exe
          path: Output/jxlshot-setup-${{ matrix.arch }}.exe
          archive: false
          if-no-files-found: error

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: true
          files: |
            jxlshot-windows-${{ matrix.arch }}.zip
            Output/jxlshot-setup-${{ matrix.arch }}.exe