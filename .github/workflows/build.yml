name: build

# One workflow, two jobs. The portable ZIP and the Inno Setup installer are
# built from the same tree, on the same triggers, so they can never disagree.
# The installer job depends on the portable job and reuses its artifact instead
# of compiling the executable a second time.
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libjxl
            zip

      - name: Compile and bundle runtime DLLs
        run: |
          # EXPLICITLY compile the resource file using windres
          windres -i resource.rc -o resource.o

          # Compile Tray version using the compiled resource object.
          # Warnings are visible in the log but do not fail the build.
          mkdir -p dist
          gcc -O2 -s -flto -ffunction-sections -fdata-sections -Wall -Wextra \
              -Wl,--gc-sections -mwindows -o dist/jxlshot_tray.exe jxlshot_tray.c resource.o \
              -ljxl_threads -ljxl -lgdi32 -luser32 -lshell32 -lcomctl32 -lmsimg32 -lole32 -ldxgi -ld3d11 -luuid -lurlmon

          # Copy auxiliary files
          cp README.md dist/ 2>/dev/null || true

          # Extract and copy required MinGW/libjxl DLLs
          # Safely catches all transitive dependencies without executing the .exe (using ldd)
          ldd dist/jxlshot_tray.exe | grep "/mingw64/bin" | awk '{print $3}' | sort -u | xargs -I {} cp {} dist/

      - name: Package Distribution (Create ZIP)
        run: |
          zip -r jxlshot-windows-x64.zip dist/
          ls -lh jxlshot-windows-x64.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-dist
          path: dist/

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jxlshot-windows-x64.zip

  installer:
    needs: portable
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the portable build
        uses: actions/download-artifact@v4
        with:
          name: jxlshot-dist
          path: dist

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          # Locate Inno Setup Compiler (ISCC) typically pre-installed on windows-latest
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-Not (Test-Path $iscc)) {
              Write-Host "Inno Setup not found. Installing via Chocolatey..."
              choco install innosetup -y --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }

          # Compile the installer script
          & $iscc setup.iss

          # Move the setup executable next to the portable build for the release
          Move-Item -Path "Output\jxlshot-setup-x64.exe" -Destination "dist\" -Force

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-setup-x64
          path: dist/jxlshot-setup-x64.exe

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/jxlshot-setup-x64.exe
