name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ---------------------------------------------------------
      # Build the C Applications (MSYS2 / MinGW-w64)
      # ---------------------------------------------------------
      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libjxl
            zip

      - name: Compile and bundle runtime DLLs
        run: |
          # 1. Compile the command-line interface (CLI) version
          gcc -O2 -mwindows -o jxlshot.exe jxlshot.c \
              -ljxl -lgdi32 -luser32 -lshell32 -lole32

          # 2. Compile the system tray version (also pulls in
          #    jxlshot_hotkeys.c for the PrintScreen / Ctrl+PrintScreen
          #    global keyboard shortcuts via #include)
          gcc -O2 -mwindows -o jxlshot_tray.exe jxlshot_tray.c \
              -ljxl -lgdi32 -luser32 -lshell32 -lcomctl32 -lmsimg32 -lole32

          # 3. Prepare distribution directory
          mkdir -p dist
          cp jxlshot.exe jxlshot_tray.exe dist/

          # 4. Extract and copy required MinGW/libjxl DLLs
          ldd jxlshot.exe jxlshot_tray.exe | grep -o '/mingw64/bin/[^ )]*' | sort -u | while read -r dll; do
            cp "$dll" dist/
          done

          # 5. Create the release archive
          (cd dist && zip -9 -r ../jxlshot-windows-x64.zip .)
          ls -la dist/

      # ---------------------------------------------------------
      # Upload and Publish
      # ---------------------------------------------------------
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-windows-x64
          path: dist/

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jxlshot-windows-x64.zip
