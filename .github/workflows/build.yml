name: build-windows

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libjxl
            zip

      - name: Compile and bundle runtime DLLs
        run: |
          gcc -O2 -mwindows -o jxlshot.exe jxlshot.c \
              -ljxl -lgdi32 -luser32 -lshell32

          mkdir -p dist
          cp jxlshot.exe dist/

          # Copy the MinGW/libjxl DLLs the executable depends on.
          ldd jxlshot.exe | grep -o '/mingw64/bin/[^ )]*' | sort -u | while read -r dll; do
            cp "$dll" dist/
          done

          (cd dist && zip -9 -r ../jxlshot-windows-x64.zip .)
          ls -la dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-windows-x64
          path: dist/

      - name: Publish release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: jxlshot-windows-x64.zip
