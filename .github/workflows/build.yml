name: build

# One workflow, three jobs:
#   portable  -> builds dist\jxlshot_tray.exe + DLLs, and a portable ZIP
#   installer -> downloads the portable EXE (not the ZIP) and builds setup.exe
#   release   -> publishes the installer EXE and portable ZIP on a tag
on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  portable:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up MSYS2 (MinGW-w64)
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libjxl
            zip

      - name: Compile and bundle runtime DLLs
        run: |
          # Compile the resource file explicitly.
          windres -i resource.rc -o resource.o

          # Build the tray executable.
          mkdir -p dist
          gcc -O2 -s -flto -ffunction-sections -fdata-sections -Wall -Wextra \
              -Wl,--gc-sections -mwindows -o dist/jxlshot_tray.exe jxlshot_tray.c resource.o \
              -ljxl_threads -ljxl -lgdi32 -luser32 -lshell32 -lcomctl32 -lmsimg32 -lole32 -ldxgi -ld3d11 -luuid -lurlmon

          # Copy auxiliary files.
          cp README.md dist/ 2>/dev/null || true

          # Copy the MinGW/libjxl DLLs that ldd reports. This does not execute
          # the application and keeps the portable bundle self-contained.
          ldd dist/jxlshot_tray.exe | grep "/mingw64/bin" | awk '{print $3}' | sort -u | xargs -r -I {} cp {} dist/

      - name: Package portable ZIP
        run: |
          # Put the files at the ZIP root, not inside an extra dist/ folder.
          (cd dist && zip -r ../jxlshot-windows-x64.zip .)
          ls -lh jxlshot-windows-x64.zip

      - name: Upload portable files
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-portable
          path: dist/
          if-no-files-found: error

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-portable-zip
          path: jxlshot-windows-x64.zip
          if-no-files-found: error

  installer:
    needs: portable
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download portable EXE and DLLs
        uses: actions/download-artifact@v4
        with:
          name: jxlshot-portable
          path: dist

      - name: Verify portable EXE
        shell: pwsh
        run: |
          # The installer must be built from the EXE, never from the ZIP.
          if (-Not (Test-Path "dist\jxlshot_tray.exe")) {
              throw "Portable EXE is missing: dist\jxlshot_tray.exe"
          }
          Get-ChildItem dist | Format-Table Name, Length

      - name: Build Inno Setup Installer
        shell: pwsh
        run: |
          $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          if (-Not (Test-Path $iscc)) {
              $iscc = "C:\Program Files\Inno Setup 6\ISCC.exe"
          }
          if (-Not (Test-Path $iscc)) {
              Write-Host "Inno Setup not found. Installing via Chocolatey..."
              choco install innosetup -y --no-progress
              $iscc = "C:\Program Files (x86)\Inno Setup 6\ISCC.exe"
          }
          if (-Not (Test-Path $iscc)) {
              throw "Inno Setup compiler not found."
          }

          # Compile setup.iss, which reads dist\jxlshot_tray.exe and dist\*.dll.
          & $iscc setup.iss
          if ($LASTEXITCODE -ne 0) {
              throw "ISCC failed with exit code $LASTEXITCODE"
          }

          if (-Not (Test-Path "Output\jxlshot-setup-x64.exe")) {
              throw "The installer EXE was not created."
          }

          # Keep the installer next to the portable files for artifact upload.
          Move-Item -Path "Output\jxlshot-setup-x64.exe" -Destination "dist\jxlshot-setup-x64.exe" -Force

      - name: Upload installer EXE
        uses: actions/upload-artifact@v4
        with:
          name: jxlshot-installer
          path: dist/jxlshot-setup-x64.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - portable
      - installer
    runs-on: ubuntu-latest
    steps:
      - name: Download portable ZIP
        uses: actions/download-artifact@v4
        with:
          name: jxlshot-portable-zip
          path: release

      - name: Download installer EXE
        uses: actions/download-artifact@v4
        with:
          name: jxlshot-installer
          path: release

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/jxlshot-setup-x64.exe
            release/jxlshot-windows-x64.zip
